name: CI

# Pull-request gate. Everything here runs against the self-hosted reference service, so a red
# check means our code or the service changed, never that a public site was down.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  quality:
    name: Format, lint, compile, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spotless check, Checkstyle, compile (-Werror), framework + tools unit tests
        run: ./mvnw verify -pl sut,framework,tools -am

  gate:
    name: PR gate suite, triage and reports
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      RECORD_MODE: failures
      RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_DIR: run-evidence/api-automation-framework/ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the reference service, framework and tools
        run: ./mvnw -DskipTests install -pl sut,framework,tools -am
      - name: Start the reference service
        run: |
          nohup java -jar sut/target/reference-service.jar > sut.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:7070/health && exit 0
            sleep 1
          done
          cat sut.log
          exit 1
      - name: PR gate suite (every layer, reference service only)
        id: tests
        run: ./mvnw verify -pl tests -Pci -Dsuite=pr-gate
      - name: Quarantined tests (run, never gate)
        if: always() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ "$(jq '.entries | length' quarantine.json)" -eq 0 ]; then
            echo "Nothing is quarantined."
            exit 0
          fi
          RUN_ID="${RUN_ID}-quarantine" ./mvnw verify -pl tests -Pci -Dsuite=quarantine
      - name: Quarantine policy (owner, expiry, matching test)
        run: java -jar tools/target/qa-tools.jar quarantine-check
      - name: Triage failures (rules first; the AI step runs only when a key is configured)
        if: always() && steps.tests.outcome == 'failure'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: java -jar tools/target/qa-tools.jar triage --run "$RUN_DIR"
      - name: Dashboard, gallery and step summary
        if: always() && steps.tests.outcome != 'skipped'
        run: java -jar tools/target/qa-tools.jar report --run "$RUN_DIR" --out reports/site
      - name: Allure report
        if: always() && steps.tests.outcome != 'skipped'
        run: scripts/allure-report.sh
      - name: Comment the summary on the pull request
        # Pull requests from forks get a read-only token; their summary stays in the job summary.
        if: >-
          always() && steps.tests.outcome != 'skipped' && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: api-test-summary
          path: reports/site/summary.md
      - name: Upload evidence and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-${{ github.run_attempt }}
          path: |
            run-evidence/
            reports/site/
            tests/target/site/allure-maven-plugin/
            tests/target/surefire-reports/
            sut.log
          retention-days: 14
          if-no-files-found: ignore

  newman:
    name: Postman collection (Newman)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: postman/package-lock.json
      - name: Build and start the reference service
        run: |
          ./mvnw -DskipTests package -pl sut -am
          nohup java -jar sut/target/reference-service.jar > sut.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:7070/health && exit 0; sleep 1; done
          cat sut.log; exit 1
      - name: Newman
        working-directory: postman
        run: |
          npm ci
          npm run newman:ci
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: reports/newman/
          retention-days: 14
          if-no-files-found: ignore
