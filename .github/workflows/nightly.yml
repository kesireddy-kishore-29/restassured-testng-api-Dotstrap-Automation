name: Nightly

# The full regression, one shard per suite, with retries (flaky detection) and both targets:
# the reference service and the public practice API, recording evidence for every test. The shards
# are merged into one run, which is triaged, reported and published to GitHub Pages with its
# history, next to the Newman report. Nothing here gates a merge.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp
  RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}
  RECORD_MODE: all
  TEST_RETRIES: "2"

jobs:
  regression:
    name: Regression shard (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, contract, functional, negative, workflows, resilience, security, booker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the reference service and framework
        run: ./mvnw -DskipTests install -pl sut,framework -am
      - name: Start the reference service
        run: |
          nohup java -jar sut/target/reference-service.jar > sut.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:7070/health && exit 0; sleep 1; done
          cat sut.log; exit 1
      - name: Suite ${{ matrix.suite }}
        run: ./mvnw verify -pl tests -Pci -Dsuite=${{ matrix.suite }}
      - name: Upload the shard's evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.suite }}
          path: run-evidence/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the shard's Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.suite }}
          path: tests/target/allure-results/
          retention-days: 14
          if-no-files-found: ignore

  newman:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: postman/package-lock.json
      - name: Build and start the reference service
        run: |
          ./mvnw -DskipTests package -pl sut -am
          nohup java -jar sut/target/reference-service.jar > sut.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:7070/health && exit 0; sleep 1; done
          cat sut.log; exit 1
      - name: Newman
        working-directory: postman
        run: |
          npm ci
          npm run newman:ci
      - name: Upload the Newman report (published next to Allure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: reports/newman/
          retention-days: 14
          if-no-files-found: ignore

  quarantine:
    name: Quarantined tests (run, never gate) and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: ./mvnw -DskipTests install -pl sut,framework,tools -am
      - name: Quarantine policy (expired or ownerless entries fail here)
        run: java -jar tools/target/qa-tools.jar quarantine-check
      - name: Run the quarantined tests
        continue-on-error: true
        run: |
          if [ "$(jq '.entries | length' quarantine.json)" -eq 0 ]; then
            echo "Nothing is quarantined."
            exit 0
          fi
          nohup java -jar sut/target/reference-service.jar > sut.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:7070/health && break; sleep 1; done
          RUN_ID="${RUN_ID}-quarantine" ./mvnw verify -pl tests -Pci -Dsuite=quarantine

  publish:
    name: Merge, triage, report and publish to Pages
    needs: [regression, newman]
    if: always() && needs.regression.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUN_DIR: run-evidence/restassured-testng-api-Dotstrap-Automation/nightly-${{ github.run_id }}-${{ github.run_attempt }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - name: Check out the published site (absent before the first publish)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: published
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the tools
        run: ./mvnw -DskipTests install -pl tools -am
      - uses: actions/download-artifact@v8
        with:
          pattern: evidence-*
          path: shards
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: tests/target/allure-results
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: newman-report
          path: newman-report
      - name: Merge the shards into one run
        run: java -jar tools/target/qa-tools.jar merge --from shards --into "$RUN_DIR"
      - name: Triage failures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: java -jar tools/target/qa-tools.jar triage --run "$RUN_DIR"
      - name: Start from the published site
        run: |
          mkdir -p site/data
          if [ -d published ]; then rsync -a --exclude .git published/ site/; fi
      - name: Record flaky tests in the 30-day history
        run: >-
          java -jar tools/target/qa-tools.jar flaky-history --run "$RUN_DIR"
          --history site/data/flaky-history.json
      - name: Dashboard, gallery and step summary
        run: >-
          java -jar tools/target/qa-tools.jar report --run "$RUN_DIR" --out site
          --history site/data/history.json --flaky-history site/data/flaky-history.json
          --report-url "$SITE_URL"
          --links "Allure=allure/,Run gallery=runs/${RUN_ID}/gallery.html,Newman=newman/index.html,Contract coverage=contract-coverage.md,Latency=latency.md"
      - name: Allure report with trend history
        run: |
          scripts/allure-report.sh site/allure
          rm -rf site/allure
          cp -r tests/target/site/allure-maven-plugin site/allure
      - name: Newman report next to Allure
        run: |
          rm -rf site/newman
          if [ -d newman-report ]; then cp -r newman-report site/newman; fi
      - name: Keep this run's gallery and evidence, and the last 10 runs
        run: |
          mkdir -p site/runs
          cp -r "$RUN_DIR" "site/runs/${RUN_ID}"
          find site/runs -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn \
            | tail -n +11 | cut -d' ' -f2- | xargs -r rm -rf
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "nightly ${{ env.RUN_ID }}"
      - name: Upload the merged run (input for heal.yml)
        uses: actions/upload-artifact@v7
        with:
          name: merged-run
          path: run-evidence/restassured-testng-api-Dotstrap-Automation/
          retention-days: 14
      - name: Upload the failure bundles
        uses: actions/upload-artifact@v7
        with:
          name: failure-bundles
          path: ${{ env.RUN_DIR }}/failure-bundles/
          retention-days: 30
          if-no-files-found: ignore
      - name: Fail when the regression failed
        if: needs.regression.result == 'failure'
        run: |
          echo "The regression failed; see the dashboard and the triage summary."
          exit 1

  flaky:
    name: Propose quarantine for repeatedly flaky tests (pull request, never merged here)
    needs: publish
    if: always() && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out the published history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: published
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the tools
        run: ./mvnw -DskipTests install -pl tools -am
      - name: Propose quarantine (3+ flaky runs in 14 days)
        run: |
          if [ ! -f published/data/flaky-history.json ]; then echo "No history yet."; exit 0; fi
          java -jar tools/target/qa-tools.jar flaky-history --propose-only \
            --history published/data/flaky-history.json
      - name: Open a pull request with the proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- quarantine.json tests/; then echo "No proposals."; exit 0; fi
          branch="quarantine/proposal-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add quarantine.json tests/
          git commit -m "test(quarantine): propose quarantine for repeatedly flaky tests"
          git push -u origin "$branch"
          gh pr create --title "Quarantine proposal $(date -u +%Y-%m-%d)" \
            --body "Tests that were flaky 3 or more times in 14 days. Each entry has an owner and an expiry; review before merging. Nothing is merged automatically."
