<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--muted:#5b6475;--line:#e3e7ef;--ok:#1f8f5f;--warn:#b7791f;--bad:#c53030}
@media (prefers-color-scheme:dark){:root{--bg:#121722;--fg:#e6e9f0;--muted:#9aa3b5;--line:#273044}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);
  font:14px/1.5 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px} p{color:var(--muted);margin:0 0 16px}
table{width:100%;border-collapse:collapse}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.n,.ms{color:var(--muted);white-space:nowrap} .s{font-weight:600}
.s.ok{color:var(--ok)} .s.warn{color:var(--warn)} .s.bad{color:var(--bad)}
.bar{position:relative;width:45%;min-width:160px}
.bar span{position:absolute;top:8px;height:10px;border-radius:3px}
.bar span.ok{background:var(--ok)} .bar span.warn{background:var(--warn)}
.bar span.bad{background:var(--bad)}
code{font-size:13px}
</style></head><body>
<h1>A full update with a token replaces the booking</h1>
<p>com.qaautomation.tests.booker.BookingCrudTest#fullUpdateWithATokenReplacesTheBooking · passed · 4 call(s) over 763 ms</p>
<table><tr><td class="n">1</td><td class="call"><code>POST /booking</code></td><td class="s ok">200</td><td class="ms">176 ms</td><td class="bar"><span class="ok" style="left:0.52%;width:23.07%" title="+4 ms"></span></td></tr>
<tr><td class="n">2</td><td class="call"><code>PUT /booking/{id}</code></td><td class="s ok">200</td><td class="ms">186 ms</td><td class="bar"><span class="ok" style="left:24.25%;width:24.38%" title="+185 ms"></span></td></tr>
<tr><td class="n">3</td><td class="call"><code>DELETE /booking/{id}</code></td><td class="s ok">201</td><td class="ms">187 ms</td><td class="bar"><span class="ok" style="left:49.41%;width:24.51%" title="+377 ms"></span></td></tr>
<tr><td class="n">4</td><td class="call"><code>GET /booking/{id}</code></td><td class="s warn">404</td><td class="ms">195 ms</td><td class="bar"><span class="warn" style="left:74.44%;width:25.56%" title="+568 ms"></span></td></tr>
</table>
</body></html>
