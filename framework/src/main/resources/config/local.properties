# Local developer defaults. Every key can be overridden by an environment variable
# (sut.baseUrl -> SUT_BASE_URL) or a system property (-Dsut.baseUrl=...).
sut.baseUrl=http://localhost:7070
booker.baseUrl=https://restful-booker.herokuapp.com
# Public demo credentials published by Restful-Booker itself.
booker.username=admin
booker.password=password123
# The reference service's seeded demo administrator (self-hosted, not a secret).
# SUT_ADMIN_PASSWORD changes it here and in the service alike.
sut.adminHandle=admin
sut.adminPassword=admin-demo-password
http.connectTimeoutMs=5000
http.readTimeoutMs=15000
http.maxRetries=2
cors.allowedOrigin=https://app.example.test
record.mode=failures
